version: '3.8'

services:
  bitcoind-regtest:
    image: ruimarinho/bitcoin-core:26.0
    container_name: obschain-bitcoind-regtest
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -rpcuser=obschain
      - -rpcpassword=obschainrpcpassword
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -zmqpubrawtx=tcp://0.0.0.0:28332
      - -zmqpubrawblock=tcp://0.0.0.0:28333
      - -zmqpubsequence=tcp://0.0.0.0:28334
      - -fallbackfee=0.0001
    ports:
      - "18443:18443"
      - "28332:28332"
      - "28333:28333"
      - "28334:28334"
    volumes:
      - bitcoin_regtest_data:/home/bitcoin/.bitcoin

volumes:
  bitcoin_regtest_data:
